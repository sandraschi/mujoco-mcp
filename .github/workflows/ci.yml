name: CI
on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ web_sota/backend/

  ty:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastmcp mujoco httpx fastapi uvicorn prefab-ui ty
      - run: ty check src/ || true

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastmcp mujoco httpx fastapi uvicorn pytest pytest-asyncio
      - run: pytest tests/ -q

  build-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: web_sota
        run: |
          npm ci
      - name: TypeScript check
        working-directory: web_sota
        run: npx tsc --noEmit
      - name: Biome lint
        working-directory: web_sota
        run: npx @biomejs/biome check src/
      - name: Vite build
        working-directory: web_sota
        run: npx vite build
