name: CI
on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: pip install fastmcp mujoco httpx fastapi uvicorn prefab-ui pytest pytest-asyncio ruff ty

      - name: Ruff lint
        run: ruff check src/ web_sota/backend/

      - name: Type check (non-blocking)
        continue-on-error: true
        run: ty check src/

      - name: Pytest
        run: pytest tests/ -q

      - uses: oven-sh/setup-bun@v2

      - name: Install web deps
        working-directory: web_sota
        run: bun install

      - name: TypeScript check
        working-directory: web_sota
        run: bunx tsc --noEmit

      - name: Biome lint
        working-directory: web_sota
        run: bunx @biomejs/biome check src/

      - name: Vite build
        working-directory: web_sota
        run: bunx vite build
