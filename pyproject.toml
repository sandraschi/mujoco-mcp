[project]
name = "mujoco-mcp"
version = "0.3.0"
description = "General-purpose MuJoCo physics simulation via MCP"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "mujoco>=3.2",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "prefab-ui>=0.14.0",
    "websockets>=10",
]

[project.scripts]
mujoco-mcp = "mujoco_mcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3",
    "httpx>=0.28",
    "ty>=0.0.50",
    "ruff>=0.16.0,<0.17",
    "pre-commit>=4.6.1",
    "pytest-cov>=7.1.0",
]
rl = [
    "stable-baselines3>=2.6",
    "sb3-contrib>=2.6",
    "tensorboard>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mujoco_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mujoco_mcp --cov-report=term-missing --cov-fail-under=30"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B007", "S310", "S603", "S607"]
