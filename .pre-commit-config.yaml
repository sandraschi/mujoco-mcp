# Fleet: mcp-central-docs/standards/CODE_QUALITY_STANDARDS.md
# Setup: just bootstrap  (or: uv sync --group dev; uv run pre-commit install)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src/|web_sota/backend/|tests/)
      - id: ruff-format
        files: ^(src/|web_sota/backend/|tests/)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5120]
